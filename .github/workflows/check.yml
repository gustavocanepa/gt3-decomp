name: check

# What can be checked without the game: every source is real C/C++ (no assembly posing as C) and
# compiles with the original compiler. Matching itself needs your own executable: run
# `python tools/build.py` locally, which links everything and compares SHA-1 with the original.
# Sources live under src/<subsystem>/<unit>/ (tools/layout.py), new matches may still sit flat in src/.

on:
  push:
  pull_request:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No assembly posing as C
        run: find src -type f \( -name '*.c' -o -name '*.cpp' \) -print0 | xargs -0 python tools/asm_policy.py
      - name: Sources are where tools/layout.py puts them, with their real names
        run: python tools/organize.py --check
      - name: Project compiler (project.toml [compiler])
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 binutils-mips-linux-gnu
          d=$(python3 -c "import tomllib,os; print(os.path.expanduser(tomllib.load(open('project.toml','rb'))['compiler']['dir']))")
          url=$(python3 -c "import tomllib; print(tomllib.load(open('project.toml','rb'))['compiler']['archive'])")
          mkdir -p "$d"
          curl -fsSL "$url" | tar -xJ -C "$d"
      - name: Other compilers named by sources (project.toml [compilers], decomp.me builds)
        run: |
          find src -type f \( -name '*.c' -o -name '*.cpp' \) > /tmp/sources.txt
          for name in $(xargs -a /tmp/sources.txt head -qn1 | sed -n 's|^/\* compiler: \([^ ]*\) \*/.*|\1|p' | sort -u); do
            url=$(python3 -c "import tomllib,sys; print(tomllib.load(open('project.toml','rb'))['compilers'][sys.argv[1]]['archive'])" "$name")
            d=$(python3 -c "import tomllib,sys,os; print(os.path.expanduser(tomllib.load(open('project.toml','rb'))['compilers'][sys.argv[1]]['dir']))" "$name")
            mkdir -p "$d"
            curl -fsSL "$url" | tar -xJ -C "$d"
            echo "installed $name"
            # tools a profile needs besides its compiler (e.g. a later assembler), by name and archive
            python3 -c "import tomllib,sys; [print(k, v) for k, v in tomllib.load(open('project.toml','rb'))['compilers'][sys.argv[1]].get('needs', {}).items()]" "$name" |
              while read -r need url; do
                [ -d ~/.local/share/gt4/compilers/"$need" ] && continue
                mkdir -p ~/.local/share/gt4/compilers/"$need"
                curl -sL "$url" | tar -xJ -C ~/.local/share/gt4/compilers/"$need" && echo "installed $need (needed by $name)"
              done
          done
      - name: Every source compiles (first-line profile, otherwise project.toml [compiler])
        run: |
          python3 - > /tmp/commands.txt <<'EOF'
          import pathlib, sys
          sys.path.insert(0, "tools")
          import project
          pathlib.Path("/tmp/default-command.txt").write_text(project.compiler_command() + "\n")
          for name in project.compilers():
              print(name, project.compiler_command(name))
          EOF
          default=$(cat /tmp/default-command.txt)
          mkdir -p /tmp/obj
          fail=0
          n=0
          while read -r f; do
            name=$(head -n1 "$f" | sed -n 's|^/\* compiler: \([^ ]*\) \*/.*|\1|p')
            cmd="$default"
            if [ -n "$name" ]; then
              cmd=$(grep "^$name " /tmp/commands.txt | cut -d' ' -f2-)
              [ -n "$cmd" ] || { echo "::error file=$f::unknown compiler $name"; fail=1; continue; }
            fi
            n=$((n + 1))
            # eval: a command may quote its own arguments (wrappers such as cc_as.sh)
            eval "$cmd \"\$f\" -o /tmp/obj/$n.o" \
              || { echo "::error file=$f::does not compile"; fail=1; }
          done < /tmp/sources.txt
          echo "$(ls /tmp/obj | wc -l) sources compiled"
          exit $fail
